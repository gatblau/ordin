[package]
name = "ordin-brand"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
ordin-types = { workspace = true }
ordin-organisation-profile = { workspace = true }
ordin-localisation = { workspace = true }
ordin-journal = { workspace = true }
# `AssetBytes.base64`: standard base64 of the file (Public Interface).
base64 = { workspace = true }
# SA-HTTP-02: the shared outbound client the program builds.
reqwest = { workspace = true }
rustls-platform-verifier = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Internal Logic C2 and A3: SHA-256 of each asset body and file.
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# Internal Logic C3: BCP 47 canonicalisation of the locale tags.
unic-langid = { workspace = true }

[build-dependencies]
# build.rs runs checks C2–C5 over the compiled-in build pack (Internal Logic A2).
serde_json = { workspace = true }
sha2 = { workspace = true }
unic-langid = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
# Unique temporary folder names in tests.
uuid = { workspace = true }
# The asset host stand-in on loopback (plan 01, HTTP stand-ins).
wiremock = { workspace = true }
