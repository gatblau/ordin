[package]
name = "ordin-dictation"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The Transcription Service (TranscriptionService.md), on only with the desktop's `minutes` switch.
transcription = [
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tokio",
    "dep:tokio-util",
    "dep:zip",
    "dep:quick-xml",
    "dep:reqwest",
    "dep:sha2",
    "dep:symphonia",
    "dep:whisper-rs",
    "dep:libc",
    "dep:windows-sys",
]

[dependencies]
ordin-types = { workspace = true }
ordin-localisation = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }
whisper-rs = { workspace = true, optional = true }

# Free space before a model download (TranscriptionService.md B2); physical memory (TRX-MACH-2).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = ["Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

# Metal on Apple silicon (TranscriptionService.md C4).
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = { workspace = true, optional = true, features = ["metal"] }

[dev-dependencies]
wiremock = { workspace = true }
ordin-organisation-profile = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[[test]]
name = "transcripts"
required-features = ["transcription"]

[[test]]
name = "registry"
required-features = ["transcription"]

[[test]]
name = "speech"
required-features = ["transcription"]
