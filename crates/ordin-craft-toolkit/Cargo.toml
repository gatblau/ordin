[package]
name = "ordin-craft-toolkit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ordin-types = { workspace = true }
ordin-mcp-front = { workspace = true }
ordin-rules = { workspace = true }
ordin-files = { workspace = true }
ordin-organisation-profile = { workspace = true }
ordin-journal = { workspace = true }
# `ToolProvider` is an `#[async_trait]` trait (Shared Context).
async-trait = { workspace = true }
reqwest = { workspace = true }
# The client side of each app's MCP mode over its stdio (SA-MCP-01).
rmcp = { workspace = true, features = ["client"] }
# `CraftAppDefinition::versions` is a Cargo SemVer requirement.
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# The tables live in the Journal's datastore; this crate writes its own statements.
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
# The real File Service and Rules Engine over a real SQLite Journal (Playbook 7.2).
ordin-agent-folders = { workspace = true }
ordin-approval = { workspace = true }
# The real MCP Front's `work` tools take a reference resolver and a block check.
ordin-service-api = { workspace = true }
# Signs the cached profile the real Organisation Profile service loads at start.
ed25519-dalek = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
