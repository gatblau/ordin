[package]
name = "ordin-obs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The OBS Recorder Adapter (ObsRecorderAdapter.md); in the desktop program only with its `minutes` switch.
[features]
# The fake OBS (`ordin_obs::fake`) and `ObsRecorder::for_fake`, for the Minutes Service's tests.
fake = []

[dependencies]
ordin-types = { workspace = true }
ordin-identity = { workspace = true }
ordin-localisation = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }

# The installation folder named in the registry (ObsRecorderAdapter.md A1).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
# The real Identity Service on a temporary Journal (lower-phase crates, dev edges only).
ordin-journal = { workspace = true }
ordin-organisation-profile = { workspace = true }
# The client Identity's configuration takes.
reqwest = { workspace = true }
tracing-subscriber = { workspace = true }

# The fake OBS on a port, for journey 13 (PB-MIN-2): `cargo run -p ordin-obs --features fake --example fake-obs`.
[[example]]
name = "fake-obs"
path = "examples/fake_obs.rs"
required-features = ["fake"]
