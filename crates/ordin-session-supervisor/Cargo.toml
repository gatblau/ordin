[package]
name = "ordin-session-supervisor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ordin-types = { workspace = true }
ordin-runtime-adapter = { workspace = true }
ordin-journal = { workspace = true }
ordin-usage-planner = { workspace = true }
ordin-run-queue = { workspace = true }
# `SupervisorHost`, `EventSink` and `PruneParticipant` are `#[async_trait]` traits (Public Interface).
async-trait = { workspace = true }
# The adapter's event stream is a `futures` `BoxStream` (Runtime Adapter interface).
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The `runs` and `tasks` tables live in the Journal's datastore; this crate writes its own statements.
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# `AdapterContext.cancel` and `wait_for_runs` take a `CancellationToken` (GracefulShutdown).
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The scripted adapter of the Runtime Adapter interface (integration test, plan Phase 4).
ordin-runtime-adapter = { workspace = true, features = ["testkit"] }
# The Usage Planner is built on the real Organisation Profile service in tests (agent-profile defaults).
ordin-organisation-profile = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
