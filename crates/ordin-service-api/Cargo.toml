[package]
name = "ordin-service-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ordin-types = { workspace = true, features = ["schema"] }
async-trait = { workspace = true }
# `catch_unwind` on the command future and the bounded concurrent reference checks (Internal Logic 3, 10.4).
futures = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
# `tokio::time::timeout_at` around each command (Internal Logic 3) and the 2 s bound per reference (10.4).
tokio = { workspace = true }
tokio-util = { workspace = true }
# The log lines `svc.command`, `svc.event_dropped`, `svc.unregistered_code`, `block.rejected` (Logging.md).
tracing = { workspace = true }
url = { workspace = true }

[[bin]]
name = "ordin-service-api-gen"
path = "src/bin/gen.rs"

[[bench]]
name = "envelope"
harness = false

[dev-dependencies]
# `start_paused` for the deadline scenarios.
tokio = { workspace = true, features = ["test-util"] }
