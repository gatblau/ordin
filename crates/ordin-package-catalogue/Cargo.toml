[package]
name = "ordin-package-catalogue"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ordin-types = { workspace = true }
ordin-catalogue = { workspace = true }
ordin-resolver = { workspace = true }
ordin-installers = { workspace = true }
ordin-checker = { workspace = true }
ordin-organisation-profile = { workspace = true }
ordin-agent-folders = { workspace = true }
ordin-package-inspector = { workspace = true }
ordin-journal = { workspace = true }
# The private port traits over the concrete providers are `#[async_trait]` (PackageCatalogue.md
# *Boundary interfaces*).
async-trait = { workspace = true }
# `TaskForm` derives `JsonSchema`, as PackageCatalogue.md PKG-TF-1 states it.
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The instance tables live in the Journal's SQLite datastore (PackageCatalogue.md *Data Model*).
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
# The bundled agents' fixed instance ids (PKG-REC-1); the test doubles also mint a `CheckRunId`.
uuid = { workspace = true }

[dev-dependencies]
# A real Package Inspector answers the update check's candidate inspection in `tests/candidate.rs`;
# it needs a real Rules Engine, built as the Package Inspector's own integration tests build it
# (lower-phase crates, dev edges only).
ordin-approval = { workspace = true }
ordin-rules = { workspace = true }
