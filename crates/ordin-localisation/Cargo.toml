[package]
name = "ordin-localisation"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = []
# ADR-042 pseudo-locales `en-XA` (accented, 40 % longer) and `ar-XB` (right-to-left), generated by build.rs.
pseudo-locales = []

[dependencies]
ordin-types = { workspace = true }
ordin-organisation-profile = { workspace = true }
ordin-journal = { workspace = true }
chrono = { workspace = true }
fluent-bundle = { workspace = true }
fluent-syntax = { workspace = true }
icu = { workspace = true, features = ["sync"] }
intl-memoizer = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
unic-langid = { workspace = true }

[build-dependencies]
fluent-syntax = { workspace = true }
icu_locale_core = { workspace = true, features = ["alloc"] }

[dev-dependencies]
# Plan 01 Phase 1 behavioural check: the phase-1 table owners register together. No phase-1 crate
# may hold a dev edge to another (same build phase), so the test lives in this phase-2 crate.
icu_locale_core = { workspace = true, features = ["alloc"] }
ordin-identity = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
testcontainers = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
