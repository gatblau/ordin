[package]
name = "ordin-checker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ordin-types = { workspace = true }
ordin-agent-model = { workspace = true }
ordin-resolver = { workspace = true }
ordin-organisation-profile = { workspace = true }
ordin-journal = { workspace = true }
# `PartSource` is an `#[async_trait]` trait; a withdrawal check wraps the source (step 27).
async-trait = { workspace = true }
# Linear-time pattern matching only (Checker.md *Security*).
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The check tables live in the Journal's datastore (Checker.md *Data Model*).
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
ordin-agent-model = { workspace = true, features = ["testkit"] }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
