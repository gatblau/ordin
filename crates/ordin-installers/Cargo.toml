[package]
name = "ordin-installers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ordin-types = { workspace = true }
ordin-agent-folders = { workspace = true }
ordin-resolver = { workspace = true }
ordin-agent-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# SHA-256 of every written file, for verify and byte restore (Approach).
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# The temporary file of each atomic write is `.ordin-tmp-<UUIDv7>` (Internal Logic 11).
uuid = { workspace = true }

[dev-dependencies]
ordin-agent-model = { workspace = true, features = ["testkit"] }
# The Agent Folder Manager is built on a migrated SQLite journal in the tests.
ordin-journal = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
