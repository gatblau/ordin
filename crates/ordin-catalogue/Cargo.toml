[package]
name = "ordin-catalogue"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ordin-types = { workspace = true }
ordin-organisation-profile = { workspace = true }
ordin-projects = { workspace = true }
ordin-format-plugins = { workspace = true }
ordin-checker = { workspace = true }
ordin-agent-model = { workspace = true }
ordin-journal = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
# SA-GIT-01: the bundled libgit2 with its HTTPS transport over the platform TLS (licence exception E1).
git2 = { workspace = true, features = ["https", "vendored-libgit2", "vendored-openssl"] }
regex = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
ordin-agent-model = { workspace = true, features = ["testkit"] }
ordin-resolver = { workspace = true }
ed25519-dalek = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
