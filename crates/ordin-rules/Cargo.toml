[package]
name = "ordin-rules"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ordin-types = { workspace = true }
ordin-approval = { workspace = true }
ordin-journal = { workspace = true }
ordin-organisation-profile = { workspace = true }
# `RulesHost` and `ContentChecker` are `#[async_trait]` traits (Public Interface).
async-trait = { workspace = true }
# Patterns of controls are compiled with the `regex` crate (ADR-098 item 4).
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# SHA-256 of canonical arguments and of message texts (Internal Logic C, D.1).
sha2 = { workspace = true }
# The engine's control-state tables live in the Journal's datastore (SA-RECON-09).
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# IDNA of non-ASCII hosts in `parse_address` (Internal Logic I).
url = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
# The scripted session of the phase behavioural check (lower-phase crate, dev edge only).
ordin-runtime-adapter = { workspace = true, features = ["testkit"] }
# The HTTP client of the content-checker stand-in in the ADR-107 scenarios.
reqwest = { workspace = true }
# PostgreSQL 18 for the migration test (plan 01, "PostgreSQL 18 in tests").
testcontainers = { workspace = true }
tokio-util = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
# The content checker stand-in answering allow, block and never (loopback only).
wiremock = { workspace = true }
