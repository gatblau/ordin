[package]
name = "ordin-jira"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The seam that points the adapter at a loopback stand-in over plain http, for this crate's tests.
# Never enabled outside `[dev-dependencies]`.
test-support = []

[dependencies]
ordin-types = { workspace = true }
ordin-identity = { workspace = true }
ordin-journal = { workspace = true }
# The `Credentials` seam over the Identity Service, so the unit tests can stand in for it.
async-trait = { workspace = true }
# Basic authentication `email:token` (Internal Logic 1.3).
base64 = { workspace = true }
# Jira's `2026-01-10T09:00:00.000+0000` times (Shared Context, *Identifiers and time*).
chrono = { workspace = true }
http = { workspace = true }
pulldown-cmark = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The SHA-256 of a downloaded attachment (Internal Logic 4.6).
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
# Random bytes for the back-off jitter (UUIDv4).
uuid = { workspace = true }

[dev-dependencies]
ordin-jira = { path = ".", features = ["test-support"] }
# The Jira Cloud stand-in on loopback (plan, "HTTP stand-ins").
wiremock = { workspace = true }
# A real SQLite file for the Identity Service's pool in the integration tests.
sqlx = { workspace = true }
# Log-capture test (tests/logging.rs).
tracing-subscriber = { workspace = true }
