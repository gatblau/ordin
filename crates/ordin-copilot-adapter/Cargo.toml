[package]
name = "ordin-copilot-adapter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# The scripted `CopilotPort` double for other crates' tests (CopilotLocalAdapter.md *Approach*).
# Turned on only from a `[dev-dependencies]` entry, never by a normal dependency.
testkit = []

[dependencies]
ordin-types = { workspace = true }
ordin-runtime-adapter = { workspace = true }
ordin-mcp-front = { workspace = true }
ordin-hook-relay = { workspace = true }
ordin-rules = { workspace = true }
ordin-identity = { workspace = true }
# `CopilotPort`, `SessionSetupSource`, `CopilotCliSource` and `RuntimeAdapter` are `#[async_trait]` traits.
async-trait = { workspace = true }
# The event streams are `futures` `BoxStream`s (Runtime Adapter interface).
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# `HostToolHandler::call` takes a `CancellationToken` (CPA-HT-1).
tokio-util = { workspace = true }
# `CliCopilotPort` names each new session with a UUIDv7.
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
# CPA-STOP-1: the quit signal (SIGTERM) sent to a CLI that has not ended on its closed input.
nix = { workspace = true }

[dev-dependencies]
# Paused time for the request time limit's log test.
tokio = { workspace = true, features = ["test-util"] }
base64 = { workspace = true }
# The real services of the integration test: a real Hook Relay, MCP Front and Rules Engine over a
# real SQLite file.
ordin-approval = { workspace = true }
ordin-journal = { workspace = true }
ordin-organisation-profile = { workspace = true }
ordin-service-api = { workspace = true }
ordin-session-supervisor = { workspace = true }
ordin-usage-planner = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }
tracing-subscriber = { workspace = true }
