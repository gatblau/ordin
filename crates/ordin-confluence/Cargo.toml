[package]
name = "ordin-confluence"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The seam that points the adapter at a loopback stand-in over plain http, for this crate's tests.
# Never enabled outside `[dev-dependencies]`.
# spec: ordin-desktop/components/ConfluenceAdapter#CONF-SEAM-3
test-support = []

[dependencies]
ordin-types = { workspace = true }
ordin-identity = { workspace = true }
ordin-approval = { workspace = true }
ordin-files = { workspace = true }
ordin-journal = { workspace = true }
# `WordToMarkdown` and the Journal's `EventSink` are `#[async_trait::async_trait]` traits.
async-trait = { workspace = true }
# Attachment bodies are shared between attempts without copying.
bytes = { workspace = true }
chrono = { workspace = true }
pulldown-cmark = { workspace = true }
quick-xml = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# spec: ordin-desktop/components/ConfluenceAdapter#CONF-SEAM-3
ordin-confluence = { path = ".", features = ["test-support"] }
# The real File Service needs a real Rules Engine and Agent Folder Manager (lower-phase crates, dev edges only).
ordin-agent-folders = { workspace = true }
ordin-organisation-profile = { workspace = true }
ordin-rules = { workspace = true }
# The token file of the Identity Service in the tests.
base64 = { workspace = true }
tracing-subscriber = { workspace = true }
# The Confluence Cloud stand-in on loopback (plan, "HTTP stand-ins").
wiremock = { workspace = true }
