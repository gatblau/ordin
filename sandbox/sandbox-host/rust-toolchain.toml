[toolchain]
# Pins the toolchain IntelliJ's Rust plugin / rustup will use for this crate.
# Pinned to an exact release so the guest artefact rebuilds byte-for-byte (ADR-018,
# OQ-WD-2). Change it only together with `make guest` and a re-pinned CHECKSUMS.txt.
channel = "1.96.0"
components = ["clippy", "rustfmt", "rust-src"]
# wasm32 target for the RustPython guest artefact (docs/design/sandbox-host ADR-013/014).
targets = ["wasm32-wasip1"]
