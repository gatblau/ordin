# The release pipeline's settings (Playbook 6.5 amendment January 2026, PB-REL-1, 5 and 7).
# One KEY=value per line, no quotes, no spaces around "=". A value already in the environment wins.
#
# The feed and upload values are GitHub releases at gatblau/ordin-releases (OQ-REL-1, resolved 2026-01-26); the
# pipeline stops, naming the empty one, if one is cleared. Upload is "dir:<folder>" or "github:<owner>/<repo>:<feed-tag>".
RELEASE_TEST_FEED_URL=https://github.com/gatblau/ordin-releases/releases/download/feed-test/latest.json
RELEASE_TEST_ARTEFACT_BASE_URL=https://github.com/gatblau/ordin-releases/releases/download
RELEASE_TEST_UPLOAD=github:gatblau/ordin-releases:feed-test
RELEASE_REAL_FEED_URL=https://github.com/gatblau/ordin-releases/releases/download/feed/latest.json
RELEASE_REAL_ARTEFACT_BASE_URL=https://github.com/gatblau/ordin-releases/releases/download
RELEASE_REAL_UPLOAD=github:gatblau/ordin-releases:feed
#
# The bundled agents (DSK-REC-39a, OQ-REC-13): a local clone of the bundled agents repository and the
# full 40-character hash of the commit to freeze into the application. The repository is
# gatblau/ordin-agents on GitHub (OQ-REC-13, amended 2026-01-28); the path is relative to this repository's
# root, where `make` runs, so clone it beside this repository.
RELEASE_BUNDLED_AGENTS_SOURCE=../ordin-agents
RELEASE_BUNDLED_AGENTS_COMMIT=47c774cd025a5d227238d3b9edc35b25dcc93e31
#
# The memory models zip (PB-REL-11): release models-1 of gatblau/ordin-releases, fetched by the application
# the first time memory is used, after the person agrees. The address, the zip's size in bytes (no
# separators) and its SHA-256. The ten file digests are read from release/memory-models/files.txt.
RELEASE_MEMORY_MODELS_URL=https://github.com/gatblau/ordin-releases/releases/download/models-1/ordin-memory-models-1.zip
RELEASE_MEMORY_MODELS_SHA256=c97ba4951a33720e317d1b95f5859f0fba075e2c0b5fa4e19bdb87694ac995d7
RELEASE_MEMORY_MODELS_BYTES=173982577
#
# The Windows installer built on the Mac (PB-REL-15 to PB-REL-18, `make release-build-windows`).
# RELEASE_ACCEPT_MSVC_LICENSE is never written here: the maintainer gives RELEASE_ACCEPT_MSVC_LICENSE=1 on the
# command line, and the build refuses it in this file. RELEASE_XWIN_CACHE_DIR may name the folder for
# Microsoft's files (default ~/.cache/cargo-xwin); it must be outside the repository and the release folder.
#
# Files beside ordin.exe in every Windows installer (PB-REL-25). DirectML.dll: Microsoft's DirectML package at
# this address and the SHA-256 of its bin/x64-win/DirectML.dll; version 1.15.4, the copy ONNX Runtime's prebuilt
# Windows library (ort 2.0.0-rc.15) ships with; change both when that version changes. The Visual C++ runtime
# (msvcp140.dll, msvcp140_1.dll, vcruntime140.dll, vcruntime140_1.dll): taken at each Windows build from the
# newest x64 Visual C++ redistributable package this Visual Studio channel lists, checked against the
# fingerprint its manifest gives.
RELEASE_WINDOWS_DIRECTML_URL=https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.4
RELEASE_WINDOWS_DIRECTML_SHA256=9c9e6d822561c6c41b90e6994b3e8857cf1d66dbfb1e0c4c799c7c89b4e92da1
RELEASE_WINDOWS_VC_CHANNEL_URL=https://aka.ms/vs/17/release/channel
#
# The gate before a release (PB-REL-21 to PB-REL-23). By default release-check and release-build run no test:
# they require a clean working tree and a git note in refs/notes/ordin-gate on the commit being built,
# written by `make gate-record` on the computer that runs the tests, fetched from the git remote
# RELEASE_GATE_REMOTE (default origin). Which remote that is belongs to the maintainer's own set-up, so it is
# given in the environment and never written here. RELEASE_GATE=local runs `make check` on this computer instead.
#
# GitHub sign-in (PB-REL-31, amended January 2026; user decision). The client id of a GitHub App the maintainer
# registered on their own GitHub account, with its device flow enabled; it is public, not a secret. Every build
# passes it to the desktop program as GITHUB_APP_CLIENT_ID (local-build, local-build-windows-remote and the release
# builds). Empty (the default): the build has no GitHub App, and people connect GitHub in Settings › Sign-ins
# with a personal access token they make themselves.
RELEASE_GITHUB_APP_CLIENT_ID=
