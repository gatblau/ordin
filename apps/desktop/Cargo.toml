[package]
name = "ordin-desktop"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ordin_desktop"
path = "src/lib.rs"

[[bin]]
name = "ordin"
path = "src/main.rs"

# Build switches (OrdinDesktop.md amendment January 2026, DSK-UP-1; Playbook §9). `team-knowledge` (DSK-TW-1)
# and `minutes` (DSK-MIN-6) are on by default, and so are `copilot` and `sandbox` (Release 2); every other switch is off by
# default, and a shipped version's manifest lists the switches its release turns on.
[features]
default = ["team-knowledge", "minutes", "copilot", "sandbox"]
sandbox = ["dep:ordin-sandbox"]
dictation = ["dep:ordin-dictation"]
copilot = ["dep:ordin-copilot-adapter"]
slack = ["dep:ordin-slack-service", "dep:ordin-slack-thread-adapter"]
mail = ["dep:ordin-mail"]
team-knowledge = ["dep:ordin-team-knowledge"]
authoring = ["dep:ordin-authoring"]
handover = ["mail", "slack", "dep:ordin-handover"]
telegram = ["dep:ordin-telegram-adapter", "dep:ordin-telegram-service"]
hosted-agents = ["dep:ordin-hosted-agent-adapter"]
# Row 3.13a only; `ordin-knowledge-query-client` stays a normal dependency (the Memory Service needs it).
knowledge-agents = []
# Meeting minutes (OrdinDesktop.md DSK-MIN-1, DSK-MIN-6): Steps 80, 81, 82; rows 3.16a, 3.16b, 3.41a. It uses
# the `ordin-dictation` crate for the Transcription Service only; it does not turn the `dictation` switch on.
minutes = ["dep:ordin-dictation", "ordin-dictation/transcription", "ordin-host/minutes", "ordin-service-api/minutes", "dep:ordin-minutes", "dep:ordin-obs"]
# Test builds only (OrdinDesktop.md DSK-JRN-1): on Windows the window opens WebView2's debugging port on
# 127.0.0.1:9222 so the journey tests (Playwright) can drive it. Never named by the release build (DSK-JRN-2).
# It also compiles the online services' test seams, so a journeys build can reach their stand-ins (DSK-JRN-4).
journeys = ["ordin-confluence/test-support", "ordin-sharepoint/test-support", "ordin-jira/test-support", "ordin-identity/test-support"]
# Test builds only (OrdinDesktop.md DSK-CHK-1, DSK-CHK-2): row 3.3 keeps secrets in an encrypted file under the data
# root instead of the keychain, for `make first-start-check` in a container with no keychain. Never named by a release
# or local build.
check-secrets = []

[dependencies]
ordin-types = { workspace = true }
ordin-service-api = { workspace = true }
ordin-runtime-adapter = { workspace = true }
ordin-journal = { workspace = true }
ordin-organisation-profile = { workspace = true }
ordin-identity = { workspace = true }
ordin-agent-model = { workspace = true }
ordin-approval = { workspace = true }
ordin-localisation = { workspace = true }
ordin-agent-folders = { workspace = true }
ordin-format-plugins = { workspace = true }
ordin-resolver = { workspace = true }
ordin-sharepoint = { workspace = true }
ordin-jira = { workspace = true }
ordin-knowledge-query-client = { workspace = true }
ordin-usage-planner = { workspace = true }
ordin-server-connector = { workspace = true }
ordin-rules = { workspace = true }
ordin-brand = { workspace = true }
ordin-checker = { workspace = true }
ordin-installers = { workspace = true }
ordin-session-supervisor = { workspace = true }
ordin-command-bridge = { workspace = true }
ordin-mcp-front = { workspace = true }
ordin-package-inspector = { workspace = true }
ordin-files = { workspace = true }
ordin-hook-relay = { workspace = true }
ordin-crew-orchestrator = { workspace = true }
ordin-memory-service = { workspace = true }
ordin-craft-toolkit = { workspace = true }
ordin-confluence = { workspace = true }
ordin-projects = { workspace = true }
ordin-claude-adapter = { workspace = true }
ordin-workspaces = { workspace = true }
ordin-catalogue = { workspace = true }
ordin-push = { workspace = true }
ordin-knowledge = { workspace = true }
ordin-package-catalogue = { workspace = true }
ordin-host = { workspace = true }
ordin-home-search = { workspace = true }
ordin-setup = { workspace = true }
# Behind build switches (DSK-UP-1).
ordin-sandbox = { workspace = true, optional = true }
ordin-dictation = { workspace = true, optional = true }
ordin-minutes = { workspace = true, optional = true }
ordin-obs = { workspace = true, optional = true }
ordin-copilot-adapter = { workspace = true, optional = true }
ordin-slack-service = { workspace = true, optional = true }
ordin-slack-thread-adapter = { workspace = true, optional = true }
ordin-mail = { workspace = true, optional = true }
ordin-team-knowledge = { workspace = true, optional = true }
ordin-authoring = { workspace = true, optional = true }
ordin-handover = { workspace = true, optional = true }
ordin-telegram-adapter = { workspace = true, optional = true }
ordin-telegram-service = { workspace = true, optional = true }
ordin-hosted-agent-adapter = { workspace = true, optional = true }
async-trait = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
# Step 2's log files (A-09): `log_files::subscriber` builds on every platform, so it is tested on Linux.
tracing-appender = { workspace = true }
uuid = { workspace = true }
# SVC-SCR-1's preview and `files.download`'s bytes.
base64 = { workspace = true }
# DSK-REC-44: the semantic-version order of `update_downgrade_seen`.
semver = { workspace = true }
# DSK-MD-6 to DSK-MD-9: the memory models download's backoff, fingerprints and unpacking.
rand = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
# DSK-KEX-1: a knowledge page's Markdown read for its PDF or Word file (the workspace's reader).
pulldown-cmark = { workspace = true }

# The desktop program ships for macOS and Windows only (HLD 05, Deployment substrate), so Tauri is not
# built, and its Linux-only dependencies are not locked into this program, on any other target.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-updater = { workspace = true }
# Step 3.5's locales and the computer's name (SPEC-GAP-32); step 2's subscriber.
tracing-subscriber = { workspace = true }
sys-locale = { workspace = true }
whoami = { workspace = true }
url = { workspace = true }

# The memory models download's stand-in host (DSK-MD Gherkin: no test reaches the network).
[dev-dependencies]
wiremock = { workspace = true }
# The end-to-end job (`tests/end_to_end.rs`): the update feed's stand-in is served over loopback HTTP,
# which the Setup Assistant accepts only with `test-support`; its log goes to the test's output.
ordin-setup = { workspace = true, features = ["test-support"] }
# The end-to-end job's Confluence link and push reach `wiremock` stand-ins through each owner's test
# seam (ConfluenceAdapter.md CONF-SEAM-2, ProjectService.md PROJ-SEAM-2), compiled only with
# `test-support`.
# spec: ordin-desktop/components/ConfluenceAdapter#CONF-SEAM-3
ordin-confluence = { workspace = true, features = ["test-support"] }
# spec: ordin-desktop/components/ProjectService#PROJ-SEAM-3
ordin-projects = { workspace = true, features = ["test-support"] }
tracing-subscriber = { workspace = true }
# DSK-KS-1's test reads the page's memory-index columns in the Journal's SQLite datastore.
sqlx = { workspace = true }
# DSK-DBX-1's tests open each file a dashboard is saved as: the PDF's pages, and every XML part of
# the Office files parsed.
lopdf = { workspace = true }
quick-xml = { workspace = true }

# The Tauri build step (`build.rs`): the Command Bridge's command names for the inline plug-in
# `ordin`. Both are built for the host; `build.rs` calls Tauri only for a macOS or Windows target.
[build-dependencies]
tauri-build = { workspace = true }
ordin-command-bridge = { workspace = true }
# Named so that the `minutes` switch ("ordin-service-api/minutes") reaches the build script too:
# build dependencies do not share features with normal ones, and without it the Command Bridge's
# IPC_COMMANDS, from which Tauri's permission list is made, would leave out the twenty minutes commands.
ordin-service-api = { workspace = true }
