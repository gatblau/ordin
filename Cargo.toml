# Third-party crates named by HLD 05 and the component specs.
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
async-nats = { version = "0.50.0", default-features = false, features = ["server_2_10", "server_2_11", "server_2_12", "server_2_14", "service", "ring", "jetstream", "nkeys", "crypto", "object-store", "kv", "nuid"] }
async-trait = "0.1"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
croner = "4.0.2"
ed25519-dalek = "3.0.0"
fastembed = { version = "7", default-features = false, features = ["ort-download-binaries-native-tls"] }
flate2 = "1.1.10"
fluent-bundle = "0.16.0"
futures = "0.3"
getrandom = "0.3"
git2 = "0.21.0"
hmac = "0.12"
http = "1"
icu = "2.4.0"
jsonwebtoken = "11.1.0"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
lettre = "0.11.23"
mail-builder = "1.0.0"
mail-parser = "0.11.9"
minisign-verify = "0.3.0"
notify = "8.2.0"
oci-client = "0.18.0"
opentelemetry = "0.33.1"
opentelemetry-otlp = "0.33.1"
opentelemetry_sdk = "0.33.1"
lopdf = "0.46.0"
portable-pty = "0.9.0"
prometheus-client = "0.25.1"
pulldown-cmark = "0.13.4"
quick-xml = "0.42.0"
rand = "0.10.3"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = "3.5.1"
rpassword = "7.5.4"
rustls = "0.23.46"
rustls-platform-verifier = "0.7.1"
