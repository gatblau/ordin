[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop", "apps/server", "apps/hook"]
exclude = ["memory", "sandbox"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
