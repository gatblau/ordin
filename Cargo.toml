serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1.17"
sha2 = "0.10"
shlex = "2.0.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "migrate", "chrono", "uuid"] }
sse-stream = "0.3.0"
subtle = "2"
tar = "0.4.46"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26.6"
tokio-tungstenite = "0.28.0"
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
trash = "5.2.9"
unicode-normalization = "0.1.26"
url = "2"
uuid = { version = "1", features = ["v4", "v7", "v5"] }
zeroize = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tauri = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }

# Test-only (dev-dependencies); used by later steps.
testcontainers = "0.27.3"
wiremock = "0.6"
