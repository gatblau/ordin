[package]
name = "memory"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "memory — agentic memory service (Phase 1 scaffolding & cross-cutting foundations)"
publish = false

[lib]
name = "memory"
path = "src/lib.rs"

[[bin]]
name = "memory"
path = "src/main.rs"
required-features = ["surreal", "http"]

[[bin]]
name = "memory-mcp"
path = "src/mcp/main.rs"
required-features = ["surreal", "http"]

# C11 — the tenancy benchmark harness. A short-lived operator-invoked batch binary, not a service:
# it binds no listener and neither shipped binary gains code from it (NFR-MA3).
[[bin]]
name = "memory-bench"
path = "src/bench/main.rs"
required-features = ["surreal"]

# ADR-101: the standalone binaries build the SurrealDB storage and the HTTP/MCP edges with the OIDC
# authenticator (both default); an embedding host takes `default-features = false` with `embedded`
# and the SQL storage, `sql`, so neither SurrealDB nor axum enters its build.
[features]
default = ["surreal", "http"]
surreal = ["dep:surrealdb"]
http = ["dep:axum", "dep:tower", "dep:tower-http", "dep:jsonwebtoken", "reqwest/rustls-tls"]
sql = ["dep:sqlx"]
embedded = []

[dependencies]
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "v5", "v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
# TLS comes with `http`: an embedding host's only use of this client is a loopback model endpoint
# (ordin C-18), and `rustls-tls` brings `webpki-roots`, a data licence ordin's build refuses.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
async-trait = "0.1"
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["catch-panic"], optional = true }
http = "1"
surrealdb = { version = "3", features = ["kv-surrealkv", "kv-mem", "protocol-ws", "protocol-http", "rustls"], optional = true }
sha2 = "0.10"
tokio-util = "0.7"
rand = "0.8"
jsonwebtoken = { version = "10", optional = true }
base64 = "0.22.1"
regex = "1"
# The SQL storage (M-2): the version and features of the ordin workspace's `sqlx`, so one build of it
# serves both when ordin embeds this crate.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "migrate", "chrono", "uuid"], optional = true }

# The integration suites drive the standalone stack (SurrealDB storage, HTTP/MCP edges, OIDC).
[[test]]
name = "bdd"
harness = false
required-features = ["surreal", "http"]

[[test]]
name = "mcp"
required-features = ["surreal", "http"]

[[test]]
name = "container"
required-features = ["surreal", "http"]

[[test]]
name = "store_remote"
required-features = ["surreal", "http"]

[[test]]
name = "bench_harness"
required-features = ["surreal"]

# The storage port's behavioural suite (ADR-101 item 4), run against every storage the build carries:
# SurrealDB under `surreal`, SQLite and PostgreSQL under `sql`.
[[test]]
name = "storage_conformance"

[dev-dependencies]
cucumber = "0.21"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
testcontainers = "0.27.3"
wiremock = "0.6"
sha2 = "0.10"
surrealdb = { version = "3", features = ["protocol-ws", "protocol-http", "rustls"] }
chrono = { version = "0.4", features = ["serde"] }
rsa = { version = "0.9.10", features = ["pem"] }
base64 = "0.22.1"

# Test programs link every crate; full debug information filled the disk on 2026-01-20.
[profile.dev]
debug = "line-tables-only"
